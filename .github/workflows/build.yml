name: Build

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Generate short SHA
        id: set-short-sha
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew detekt testDebugUnitTest assembleRelease

      # One upload, not five per-ABI splits: assembleRelease produces app-release.apk
      # (universal). A -PvelaAbi=arm64-v8a build additionally produces the arm64 APK,
      # which is picked up when present (if-no-files-found: warn, never fail).
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: vela-release-unsigned-${{ env.SHORT_SHA }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
          if-no-files-found: warn
