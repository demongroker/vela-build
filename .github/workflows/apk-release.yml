name: Build signed APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          BIN=$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)
          if [ -n "$BIN" ]; then
            yes | "$BIN/sdkmanager" --licenses >/dev/null 2>&1 || true
            "$BIN/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
          fi
          ls "$SDK/platforms" 2>/dev/null | tail -3

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MPVKT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release (universal + per-ABI)
        env:
          MPVKT_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MPVKT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MPVKT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p out
          # universal first (works on any ABI)
          ./gradlew --no-daemon testDebugUnitTest assembleRelease -x lint
          cp app/build/outputs/apk/release/app-release.apk "out/vela-${VERSION}.apk"
          # then the arm64-only build: same versionCode, roughly half the size
          ./gradlew --no-daemon assembleRelease -x lint -PvelaAbi=arm64-v8a
          cp app/build/outputs/apk/release/app-release.apk "out/vela-${VERSION}-arm64.apk"
          ls -la out

      - name: Collect APKs
        run: ls -la out

      - name: Checksums
        run: |
          cd out
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done
          cat *.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mpvkt-signed-apks
          path: out/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"

          # Unit-test count straight from the JUnit XML the build just wrote.
          TESTS=$(find app/build/test-results/testDebugUnitTest -name '*.xml' -print0 2>/dev/null \
            | xargs -0 grep -ho 'tests="[0-9]*"' 2>/dev/null \
            | sed 's/[^0-9]//g' | awk '{s+=$1} END {print s+0}')

          # Signer fingerprint, short prefix only — never the full certificate.
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -1 || true)
          SIGNER="unknown"
          if [ -n "${APKSIGNER:-}" ]; then
            SIGNER=$("$APKSIGNER" verify --print-certs "out/vela-${VERSION}.apk" 2>/dev/null \
              | grep -i 'sha-256 digest' | head -1 | awk -F': ' '{print $NF}' \
              | tr -d ':' | tr 'A-F' 'a-f' | cut -c1-8 || true)
            [ -n "$SIGNER" ] || SIGNER="unknown"
          fi

          {
            echo "Vela ${TAG} — signed build."
            echo ""
            echo "- sha: ${GITHUB_SHA}"
            echo "- unit tests: ${TESTS}"
            echo "- signer: ${SIGNER} (certificate SHA-256 prefix)"
            echo ""
            echo "| Asset | SHA-256 |"
            echo "| --- | --- |"
            for f in out/*.apk.sha256; do
              base=$(basename "$f" .sha256)
              sum=$(awk '{print $1}' "$f")
              echo "| \`${base}\` | \`${sum}\` |"
            done
          } > "$RUNNER_TEMP/notes.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            # Never clobber a richer body: if the existing notes carry their own sections
            # (a hand-written or generated changelog), keep them and append the build block.
            gh release view "$TAG" --json body -q .body > "$RUNNER_TEMP/existing.md" || true
            if grep -qE '^(#|##|###) ' "$RUNNER_TEMP/existing.md" 2>/dev/null; then
              { cat "$RUNNER_TEMP/existing.md"; echo ""; echo "---"; echo ""; cat "$RUNNER_TEMP/notes.md"; } > "$RUNNER_TEMP/merged.md"
            else
              cp "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/merged.md"
            fi
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/merged.md"
          else
            gh release create "$TAG" out/* --title "Vela ${TAG}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
