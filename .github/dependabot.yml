version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    ignore:
      # AGP 9.x needs a Gradle 9 migration - do it deliberately, not via bump PR
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
